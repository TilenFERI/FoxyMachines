name: Build (Maven)

on:
  push:
    branches:
      - master
      - main
      - slimefun5-port
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify Maven wrapper (if present)
        run: |
          if [ -f ./mvnw ]; then
            chmod +x mvnw
          fi

      - name: Download Slimefun 5 API and InfinityLib
        run: |
          curl -fL "https://github.com/Slimefun5/Slimefun5/releases/download/v5.3.3/Slimefun-5.3.3.jar" -o Slimefun-5.3.3.jar
          curl -fL "https://github.com/Slimefun5/InfinityLib/releases/download/v1.3.13/InfinityLib.jar" -o InfinityLib.jar
          mvn -B org.apache.maven.plugins:maven-install-plugin:3.1.3:install-file -Dfile=Slimefun-5.3.3.jar -DgroupId=local.slimefun -DartifactId=Slimefun5 -Dversion=5.3.3 -Dpackaging=jar
          mvn -B org.apache.maven.plugins:maven-install-plugin:3.1.3:install-file -Dfile=InfinityLib.jar -DgroupId=local.slimefun -DartifactId=InfinityLib -Dversion=1.3.13 -Dpackaging=jar

      - name: Build with Maven
        run: mvn -B clean package

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoxyMachines-build
          path: target/*.jar
          if-no-files-found: error
